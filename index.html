<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Black One</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const renderError = function (title, detail) {
          const root = document.getElementById("root");
          const container = document.createElement("div");
          container.style.cssText =
            "padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#fff;color:#111;min-height:100vh;box-sizing:border-box;";
          container.innerHTML =
            '<h1 style="font-size:18px;font-weight:600;margin:0 0 12px;">Black One — ' +
            title +
            "</h1>" +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:16px;border-radius:6px;font-size:12px;line-height:1.5;border:1px solid #ddd;">' +
            detail +
            "</pre>";
          document.body.innerHTML = "";
          document.body.appendChild(container);
          if (root && root.parentNode) root.parentNode.removeChild(root);
        };
        window.addEventListener(
          "error",
          function (event) {
            const detail =
              (event.error && event.error.stack) ||
              event.message ||
              "Failed to load a resource";
            renderError(
              "Startup error",
              detail + "\n\n(target: " + (event.target && (event.target.src || event.target.href)) + ")",
            );
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (event) {
          const reason = event.reason;
          const detail =
            (reason && reason.stack) ||
            (typeof reason === "string" ? reason : JSON.stringify(reason));
          renderError("Unhandled promise rejection", detail || "Unknown error");
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
